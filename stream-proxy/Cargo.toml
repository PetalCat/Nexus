[package]
name = "nexus-stream-proxy"
version = "0.1.0"
edition = "2024"

[lib]
name = "nexus_stream_proxy"
path = "src/lib.rs"

[[bin]]
name = "nexus-stream-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
dashmap = "6"
socket2 = "0.5"
urlencoding = "2.1.3"
m3u8-rs = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PASETO v4.local verify + PASERK k4.local key parsing. Chosen over rusty_paseto
# because pasetors' low-level `version4::LocalToken` API takes the footer +
# implicit assertion as raw &[u8] — exactly what byte-identical cross-language
# compatibility with the Node `paseto-ts` mint needs (no opinionated footer /
# assertion struct serialization to reconcile). Default features give std + v4 +
# paserk; serde_json lets us parse claims.
pasetors = { version = "0.7", features = ["serde_json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
